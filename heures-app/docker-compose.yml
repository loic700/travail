version: "3.8"

services:
  # Serveur de sauvegarde (API pour stocker le planning et les réglages)
  # Plus besoin d'exposer son port publiquement : nginx le contacte en interne via le réseau Docker.
  api:
    build: ./server
    container_name: heures-api
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - heures-data:/app/data

  # Serveur web qui sert la page HTML ET redirige /api/... vers le conteneur api
  web:
    image: nginx:alpine
    container_name: heures-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  heures-data:
